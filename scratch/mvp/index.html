<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
// ============================================================================
// scratch/mvp — Ten P1 プロトタイプ
//   docs/20_basic_design/screens.md（案 A）と balance.md の初期値を実装したもの。
//   目的は「駆け引きが成立するか」「盲目 7 秒が緊張か退屈か」を測ること。
//   ★ 使い捨て。src/ から import しない。テストの対象にしない。
// ============================================================================

// ---- 定数（balance.md）----------------------------------------------------
const HZ = 20, NIGHT = 5400;              // 20Hz / 一晩 5400 tick = 4分30秒
const SEC = t => t * HZ;
const AROUSAL_MAX = 100, REARM = 40;      // REQ-052
const T_CLOSED = 60, T_SETTLE = 60, T_GRACE = 20;   // 寝たふり（合計 140t = 7秒）
let DOZE_FROM = 600, DOZE_EVERY = 80, DOZE_P = 0.01;   // ← 掃引で決めた
let FALL_ASLEEP_P = 0.04;
let AROUSAL_DECAY_EVERY = 25;   // 覚醒度 −1 の間隔（親が寝ているとき）
let UP_DECAY_EVERY = 6;         // 親がベッドを出ているときは速く落ち着く
let UP_ACT_PENALTY = 60;        // REQ-030「行動しない状態が続くと再び寝る」
                                //   → 行動すると、その分だけ落ち着きが止まる
let VIGOR_EVERY = 10;           // 元気 +1 の間隔
// REQ-013: どの対処も、赤ちゃんの状態を少なくとも 1 つ改善し、少なくとも 1 つ悪化させる
const CARE = [
  { k:'patpat', name:'トントン',  ar:5,  vig:15, hab:25, dur:100,
    bad:'手を封じられる', lock:['kick'], lockFor:140 },
  { k:'milk',   name:'ミルク',    ar:10, vig:40, hab:20, dur:160,
    bad:'飲んでいる間は動けない', lock:['cry','fuss','kick'], lockFor:160 },
  { k:'hold',   name:'抱っこ',    ar:25, vig:10, hab:30, dur:120,
    bad:'落ち着いて泣きにくくなる', damp:0.5, dampFor:240 },
  { k:'diaper', name:'オムツ替え',ar:30, vig:5,  hab:15, dur:140,
    bad:'終わると親が寝直しやすい', arAfter:-12 },
];
const ACT = {
  cry:  { name:'泣く',    base:30, vig:20, dur:40, draw:0.50 },
  fuss: { name:'ぐずる',  base:15, vig:11, dur:24, draw:0.35 },
  kick: { name:'ばたつく', base:14, vig:12, dur:32, draw:0.75 },
};
const PRETEND_BASE = 60;                  // REQ-015: その夜のどの行動より大きい
let PRETEND_FLOOR = 0.55;                 // 覚醒度が高くても効く＝「最後の一撃」の役割
// --- 新要素（要件外。scratch で検証中）---
let CHARGE_MAX = 70;        // 最大まで引っ張るのに要る tick（実時間 3.5 秒）
let CHARGE_MIN_K = 0.35;    // 押してすぐ離したときの効き
let CHARGE_EXP = 1.7;       // 元気の消費は強度に対して**加速する**（強く出すほど割に合わない）
let HOLD_DRAIN = 12;        // 満タンで持ち続けると元気が減る間隔（tick）
let DIP_WINDOW = 36;        // 寝入りばなの窓（実時間 1.8 秒）
let DIP_BONUS = 2.5;        // 窓に当てたときの倍率（掃引で決定）
let DIP_EVERY = 300;        // 寝入りばなが訪れる間隔の目安
let DIP_WARN = 90;          // その予兆（呼吸が深くなる）。**顔を見ていれば分かる**
// --- 診断パラメータ（検証中）。各軸は「量」ではなく「起こし方の質」で分ける ---
const PARAMS = ['いらだち','疲労','徒労','寝不足','不安','翻弄','いとおしさ'];
const EVENTS = [
  { k:'diaper',  name:'オムツが汚れた',      note:'山札にオムツ替えが 1 枚' },
  { k:'partner', name:'もう一人の親が起きた', note:'山札が 2 枚増えた' },
  { k:'phone',   name:'親のスマホが鳴った',   note:'覚醒度が少し上がった' },
  { k:'roll',    name:'親が寝返りを打った',   note:'しばらく顔が見えない' },
  { k:'hungry',  name:'おなかが空いた',       note:'しばらく元気が減り続ける' },
];

// ---- 決定論的乱数（ADR-0008: Hash(seed, 用途, 通番)）------------------------
function rng(seed, purpose, n) {
  let h = 2166136261 >>> 0;
  const s = seed + '|' + purpose + '|' + n;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
const pretendRate = n => Math.max(0.10, 0.70 * Math.pow(0.6, n - 1));   // REQ-017

// ---- 状態（data_model.md 4 節）---------------------------------------------
function newRun(seed) {
  const total = 8 + Math.floor(rng(seed, 'parent_hand', 0) * 7);        // 8〜14 枚
  const hand = [1, 1, 1, 1];                                            // 各種 1 枚以上
  for (let i = 0; i < total - 4; i++) hand[Math.floor(rng(seed, 'parent_hand', i + 1) * 4)]++;
  // その夜の出来事: 3〜5 回。時刻と種類はシードで決まる（REQ-043）
  const evN = 3 + Math.floor(rng(seed, 'night_event', 0) * 3);
  const events = [];
  for (let i = 0; i < evN; i++) {
    const lo = Math.floor(NIGHT * (i + .35) / (evN + 1)), hi = Math.floor(NIGHT * (i + 1.1) / (evN + 1));
    events.push({ tick: lo + Math.floor(rng(seed, 'night_event', i * 2 + 1) * (hi - lo)),
                  kind: Math.floor(rng(seed, 'night_event', i * 2 + 2) * EVENTS.length) });
  }
  return {
    seed, tick:0, events, eventsFired:0, rollUntil:0, hungryUntil:0, lastEvent:null, calmBlock:0,
    lockKinds:[], lockUntil:0, dampUntil:0, damp:1, partnerHere:false,
    charge:0, chargeKind:null, dipUntil:0, dipWarnAt:DIP_EVERY, dipNext:1e9, lastGain:0, lastDip:false,
    baby:'Open', actKind:null, actRemain:0, vigor:100,
    parent:'Sleep', arousal: 30 + Math.floor(rng(seed, 'parent_initial', 0) * 30),
    careKind:null, careRemain:0, careDelay:0, pendingCare:null,
    habit:[0,0,0,0], hand, handTotal: hand.reduce((a,b)=>a+b,0),
    tIdle:0, tClosed:0, tSettle:0, tGrace:0,
    pretendN:0, dozeN:0, choiceN:0,
    score:0, scoredEdge:false, pretendPrimed:false,
    P:[0,0,0,0,0,0,0], lastActTick:-999, quietRun:0, lastCareEnd:-999,
    over:null, log:[],
  };
}

// ---- 1 tick 進める（screens.md 4.5 の順 1〜11。純関数的に扱う）--------------
function step(s, input) {
  if (s.over) return s;
  const say = m => { s.log.push(m); if (s.log.length > 4) s.log.shift(); };

  // 順1: 入力。{held: 押しっぱなしの行動, tap: 'eye'}
  const held = input && input.held, tap = input && input.tap;
  if (s.baby === 'Closed') {
    if (tap === 'eye') { s.baby = 'Open'; s.tClosed = 0; }            // 目を開ける
    // 閉眼中の覚醒行動は捨てる（REQ-059）
  } else if (s.baby === 'Charge') {
    if (held === s.chargeKind) {                                      // 引っ張り続ける
      s.charge = Math.min(1, s.charge + 1 / CHARGE_MAX); s.tIdle = 0;
      // 満タンのまま溜め続けると元気が減る（寝入りばなを待つのはタダではない）
      if (s.charge >= 1 && s.tick % HOLD_DRAIN === 0) s.vigor = Math.max(0, s.vigor - 1);
      if (s.vigor <= 0) release(s);
    } else { release(s); }                                            // 離した → 発火
  } else if (s.baby === 'Open') {
    if (tap === 'eye') { s.baby = 'Closed'; s.tClosed = 0; }
    else if (held && ACT[held] && s.vigor >= ACT[held].vig * CHARGE_MIN_K
             && !(s.tick < s.lockUntil && s.lockKinds.includes(held))) {
      s.baby = 'Charge'; s.chargeKind = held; s.tIdle = 0;
      // 猶予中（背中スイッチ）は溜めない。反射なので押した時点で最大
      s.charge = (s.parent === 'Grace') ? 1 : 0;
      if (s.parent === 'Grace') release(s);
    }
  }
  // Act 中は別の行動を受け付けない（REQ-003）

  // 順2: その時刻の出来事（REQ-043 / 055）
  while (s.eventsFired < s.events.length && s.events[s.eventsFired].tick <= s.tick) {
    const e = EVENTS[s.events[s.eventsFired].kind]; s.eventsFired++;
    s.lastEvent = e;
    if (e.k === 'diaper')  { s.hand[3]++; s.handTotal++; }
    if (e.k === 'partner') { s.hand[0]++; s.hand[1]++; s.handTotal += 2; s.partnerHere = true; }
    if (e.k === 'phone')   s.arousal = Math.min(AROUSAL_MAX, s.arousal + 8);
    if (e.k === 'roll')    s.rollUntil = s.tick + 200;
    if (e.k === 'hungry')  s.hungryUntil = s.tick + 400;
    say(e.name);
  }
  if (s.tick < s.hungryUntil && s.tick % 40 === 0) s.vigor = Math.max(0, s.vigor - 1);

  // 順3: 覚醒度に依存しない親の遷移
  if (s.baby === 'Act' && --s.actRemain <= 0) { s.baby = 'Open'; s.actKind = null; s.didFire = false; s.actStr = undefined; }

  if (s.parent === 'Settle') {
    if (s.baby !== 'Closed') {                                        // 早すぎ → 気づかれる
      s.parent = 'Care'; startCare(s, true); say('気づかれた');
    } else if (++s.tSettle >= T_SETTLE) { s.parent = 'Grace'; s.tGrace = 0; }
  } else if (s.parent === 'Grace') {
    if (s.pretendPrimed) { /* 順7で解決 */ }
    else if (++s.tGrace >= T_GRACE) { s.parent = 'Sleep'; say('猶予を逃した'); }
  } else if (s.parent === 'Care') {
    if (--s.careRemain <= 0) {
      const c = CARE[s.careKind];
      s.arousal = Math.min(AROUSAL_MAX, s.arousal + c.ar);
      s.vigor = Math.min(100, s.vigor + c.vig);
      s.habit[s.careKind] = Math.min(100, s.habit[s.careKind] + c.hab);
      if (c.arAfter) s.arousal = Math.max(0, s.arousal + c.arAfter);   // 寝直しやすい
      if (s.careKind === 0 && s.baby !== 'Act') s.P[6] += 14;          // いとおしさ: トントンで収まった
      s.parent = 'Sleep'; s.careKind = null; s.lastCareEnd = s.tick;
    }
  } else if (s.pendingCare !== null && --s.careDelay <= 0 && s.parent === 'Sleep') {
    s.careKind = s.pendingCare; s.pendingCare = null; startCare(s, false);
  }

  // 順4: 時計
  if (s.baby !== 'Act') s.tIdle++;
  if (s.baby === 'Closed') s.tClosed++;

  // 順5: 寝たふりの判定（親が Sleep のときだけ。fall_asleep → sleep_pretend、同じ n）
  let drewPretend = false;
  if (s.baby === 'Closed' && s.tClosed >= T_CLOSED && s.parent === 'Sleep') {
    const n = s.pretendN + 1; drewPretend = true; s.tClosed = 0;
    if (rng(s.seed, 'fall_asleep', n) < FALL_ASLEEP_P) { s.pretendN = n; return end(s, 'fellAsleep'); }
    if (rng(s.seed, 'sleep_pretend', n) < pretendRate(n)) { s.parent = 'Settle'; s.tSettle = 0; }
    s.pretendN = n;
  }

  // 寝入りばな: 予兆（呼吸が深くなる）→ 窓 の 2 段。**予兆は顔を見ていれば分かる**
  if (s.parent === 'Sleep' && s.tick >= s.dipWarnAt && s.dipNext > 1e8) {
    s.dipNext = s.tick + DIP_WARN;                       // 予兆が始まった
  }
  if (s.dipNext <= 1e8 && s.tick >= s.dipNext) {
    s.dipUntil = s.tick + DIP_WINDOW;                    // 窓が開いた
    s.dipNext = 1e9;
    s.dipWarnAt = s.tick + DIP_EVERY + Math.floor(rng(s.seed, 'parent_choice', 9000 + s.tick) * 180);
  }

  // 順6: 待機中の寝落ち（Settle / Grace 中は停止。判定した tick はスキップ）
  if (!drewPretend && s.parent !== 'Settle' && s.parent !== 'Grace'
      && s.tIdle >= DOZE_FROM && s.tIdle % DOZE_EVERY === 0) {
    s.dozeN++;
    if (rng(s.seed, 'doze_off', s.dozeN) < DOZE_P) return end(s, 'fellAsleep');
  }

  // 順7: 状態値の更新（予約した最大の一撃もここで適用）
  if (s.pretendPrimed && s.parent === 'Grace') {
    s.arousal = Math.min(AROUSAL_MAX, s.arousal + gain(s, PRETEND_BASE, -1, PRETEND_FLOOR));
    s.pretendPrimed = false; s.parent = 'Sleep'; say('★ 背中スイッチ');
    s.P[2] += 130; s.P[3] += 20;                       // 徒労（大）+ 寝不足
  }
  if (s.baby === 'Act' && !s.didFire) {
    s.didFire = true;
    const str = s.actStr === undefined ? 1 : s.actStr;      // 引っ張った強さ（0.35〜1.0）
    const dip = s.tick < s.dipUntil;                        // 寝入りばなの窓
    if (s.parent === 'Care' || s.pendingCare !== null) s.P[5] += 34;   // 翻弄: 手を出させて空振り
    // REQ-049「親が対処を返すまでの間」は、対処中だけでなく**予告中も含む**
    if (s.parent !== 'Care' && s.pendingCare === null) {
      const g = Math.max(1, Math.round(gain(s, ACT[s.actKind].base, -1) * str * (dip ? DIP_BONUS : 1)));
      s.arousal = Math.min(AROUSAL_MAX, s.arousal + g);
      s.lastGain = g; s.lastDip = dip;
      if (dip) say('★ 寝入りばな');
      // --- 診断パラメータ。1 行動で複数の軸に乗る ---
      const S10 = Math.round(str * 10);
      const seq = (s.tick - s.lastActTick) < 120;                    // 直前も行動していた
      s.P[0] += seq ? S10 * 2 : S10;                                 // いらだち: 強く・連続で
      if (s.arousal < 30) s.P[3] += S10 * 2;                         // 寝不足: 熟睡を起こす
      if (dip)            s.P[3] += 30;                              // 寝不足: 寝入りばなを潰す
      if (Math.max(...s.habit) > 50) s.P[4] += 10;                   // 不安: 慣れているのに泣く
      if (s.tick - s.lastCareEnd < 80) s.P[4] += 14;                 // 不安: 対処の直後に再び泣く
      // ランダムに 3 つ目が乗る（用途 diagnosis。決定論を壊さない）
      const r = rng(s.seed, 'diagnosis', s.tick);
      if (r < 0.25) s.P[Math.floor(rng(s.seed,'diagnosis', s.tick+7) * 7)] += 8;
      s.lastActTick = s.tick; s.quietRun = 0;
    }
    // 対処を引き出す。**強く引っ張るほど出やすい**
    if (s.parent === 'Sleep' && s.pendingCare === null && s.handTotal > 0
        && rng(s.seed, 'parent_choice', ++s.choiceN) < ACT[s.actKind].draw * str) {
      const avail = [0,1,2,3].filter(i => s.hand[i] > 0);
      s.pendingCare = avail[Math.floor(rng(s.seed, 'parent_choice', s.choiceN + 5000) * avail.length)];
      s.careDelay = 20 + (14 - s.handTotal) * 6;                       // REQ-046
    }
  }
  if (s.calmBlock > 0) s.calmBlock--;
  const decayEvery = s.parent === 'Up' ? UP_DECAY_EVERY : AROUSAL_DECAY_EVERY;
  const canCalm = s.parent !== 'Care' && !(s.parent === 'Up' && s.calmBlock > 0);
  if (canCalm && s.tick % decayEvery === 0) s.arousal = Math.max(0, s.arousal - 1);
  if (s.tIdle > 0 && s.tIdle % VIGOR_EVERY === 0) s.vigor = Math.min(100, s.vigor + 1);
  if (s.tIdle > 0 && s.tIdle % 60 === 0 && s.vigor >= 45) { s.P[6] += 5; s.quietRun++; }
  // ↑ いとおしさ: **元気があるのに**静かにした時間だけ数える（元気切れの待機は意図ではない）
  if (s.tick % 60 === 0) s.habit = s.habit.map(h => Math.max(0, h - 1));

  // 順8: 覚醒度に依存する親の遷移
  if (s.arousal >= AROUSAL_MAX && s.parent !== 'Up') { s.parent = 'Up'; }
  else if (s.parent === 'Up' && s.arousal <= REARM) { s.parent = 'Sleep'; }

  // 順9: 得点（上限到達のエッジ。REQ-052）
  if (s.arousal >= AROUSAL_MAX && !s.scoredEdge) { s.score++; s.scoredEdge = true; say('+1 点'); }
  if (s.arousal <= REARM) s.scoredEdge = false;

  // 順10: 終了（夜明け → 寝落ち → 山札切れ）
  s.tick++;
  if (s.tick >= NIGHT) return end(s, 'dawn');
  if (s.handTotal <= 0 && s.parent !== 'Care') return end(s, 'handEmpty');
  return s;
}

let GAIN_FLOOR = 0.25;   // これが無いと覚醒度 100 に到達できない（REQ-011 が達成不能）
// 長押しを離した瞬間に発火する。引っ張った長さが強度になる
function release(s) {
  const k = s.chargeKind, a = ACT[k];
  const str = CHARGE_MIN_K + (1 - CHARGE_MIN_K) * s.charge;           // 0.35〜1.0
  s.baby = 'Act'; s.actKind = k; s.actRemain = Math.round(a.dur * (0.5 + 0.5 * str));
  s.didFire = false;   // この行動はまだ発火していない
  s.actStr = str; s.charge = 0; s.chargeKind = null;
  s.vigor = Math.max(0, s.vigor - a.vig * Math.pow(str, CHARGE_EXP));
  if (s.parent === 'Up') s.calmBlock = UP_ACT_PENALTY;
  if (k === 'cry' && s.parent === 'Grace') s.pretendPrimed = true;
}

function gain(s, base, careIdx, floor) {
  const hab = careIdx >= 0 ? s.habit[careIdx] : Math.max(...s.habit);
  const k = Math.max(floor || GAIN_FLOOR, 1 - s.arousal / AROUSAL_MAX);   // 単調非増加は保つ（REQ-012）
  const d = s.tick < s.dampUntil ? s.damp : 1;                   // 抱っこの後は効きが落ちる
  return Math.max(1, Math.ceil(base * k * d * (1 - hab / 200)));
}
function startCare(s, forced) {
  if (forced) { s.careKind = 2; }                                      // 気づかれたら「抱っこ」
  s.hand[s.careKind]--; s.handTotal--;
  const c = CARE[s.careKind];
  s.careRemain = c.dur; s.parent = 'Care';
  s.P[1] += Math.round(c.dur / 4);                     // 疲労: 重い対処ほど
  if (s.baby === 'Charge') { s.baby = 'Open'; s.charge = 0; s.chargeKind = null; }  // 溜めが飛ぶ
  if (c.lock) { s.lockKinds = c.lock; s.lockUntil = s.tick + c.lockFor; }   // 行動が使えなくなる
  if (c.damp) { s.damp = c.damp; s.dampUntil = s.tick + c.dampFor; }        // 効きが落ちる
}
function end(s, kind) { s.over = kind; return s; }

// ============================================================================
// ループ
// ============================================================================
let S = newRun(new Date().toISOString().slice(0, 10));
let held = null, tap = null, acc = 0, last = performance.now(), showNum = true;
let shake = 0, popT = 0, lastEvShown = null, upT = 0;
let closedYaw = null;   // 目を閉じた瞬間の首の向き（D-12。抱き上げられても変えない）

const $ = id => document.getElementById(id);
const btn = { cry:$('b-cry'), fuss:$('b-fuss'), kick:$('b-kick'), eye:$('b-eye') };
for (const k of ['cry','fuss','kick']) {
  btn[k].addEventListener('pointerdown', e => { e.preventDefault(); held = k; });
  btn[k].addEventListener('pointerup',   () => { if (held === k) held = null; });
  btn[k].addEventListener('pointercancel', () => { if (held === k) held = null; });
  btn[k].addEventListener('pointerleave', () => { if (held === k) held = null; });
}
btn.eye.addEventListener('pointerdown', e => { e.preventDefault(); tap = 'eye'; });
$('toggle').onclick = () => { showNum = !showNum; $('hud').classList.toggle('off', !showNum);
  $('toggle').textContent = showNum ? '詳細 ON' : '詳細 OFF'; };
$('b-again').onclick = () => { S = newRun(S.seed + '#' + (Math.random()*1e6|0)); $('banner').style.display = 'none'; };

function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(now - last, 250); last = now;
  while (acc >= 1000 / HZ) {                       // 固定 tick。実フレームレートに依存させない
    acc -= 1000 / HZ;
    const b0 = S.baby;
    const a0 = S.arousal, p0 = S.parent, s0 = S.score;
    S = step(S, { held, tap }); tap = null;
    if (b0 !== 'EyesClosed' && S.baby === 'Closed') closedYaw = yaw;   // 閉じた向きを凍結
    if (S.baby !== 'Closed') closedYaw = null;
    if (S.arousal > a0) { shake = Math.min(1, (S.arousal - a0) / 22);
      pop((S.lastDip ? '★ ' : '') + '+' + (S.arousal - a0)); }
    if (S.score > s0) pop('★ +1 点');
    if (p0 !== 'Care' && S.parent === 'Care') pop(CARE[S.careKind].name);
    if (S.lastEvent && S.lastEvent !== lastEvShown) { lastEvShown = S.lastEvent; pop(S.lastEvent.name); }
    if (S.over) { showEnd(); break; }
  }
  draw();
  renderer.render(scene, camera);
}

// 「今どこを見ているか」。一人称の必然性はここに宿る。
// 親の顔・親の手・窓は同時に視界へ入らない（首の可動範囲より離れている）
const _f = new THREE.Vector3(), _t = new THREE.Vector3(), _c = new THREE.Vector3(), _p = new THREE.Vector3();
function lookingAt() {
  camera.getWorldPosition(_c); camera.getWorldDirection(_f);
  let best = null, bestAng = 0.35;                     // 約 20 度以内
  for (const [k, obj] of [['face', head], ['hand', hand], ['window', win]]) {
    if ((k === 'face' || k === 'hand') && !parent.visible) continue;
    obj.getWorldPosition(_p);
    _t.copy(_p).sub(_c).normalize();
    const ang = Math.acos(Math.max(-1, Math.min(1, _f.dot(_t))));
    if (ang < bestAng) { bestAng = ang; best = k; }
  }
  return best;
}

function pop(txt) { $('pop').textContent = txt; popT = 0.9; }

function draw() {
  // 揺れ。泣いたことが体で分かるようにする
  shake = Math.max(0, shake - 0.045);
  const sh = shake * 0.055;
  neck.rotation.z = yaw + Math.sin(performance.now() / 26) * sh;
  pitch.rotation.x = Math.PI / 2 + pit + Math.cos(performance.now() / 19) * sh;
  popT = Math.max(0, popT - 0.016);
  $('pop').style.opacity = popT > 0 ? Math.min(1, popT * 2.2) : 0;

  const closed = S.baby === 'Closed';
  $('lid').style.opacity = closed ? 1 : 0;
  $('top').style.opacity = closed ? 0 : 1;
  $('hud').style.opacity = closed ? 0 : 1;
  for (const k of ['cry','fuss','kick']) {
    btn[k].disabled = closed || S.baby === 'Act' || S.vigor < ACT[k].vig * CHARGE_MIN_K
      || (S.tick < S.lockUntil && S.lockKinds.includes(k));
    const on = S.baby === 'Charge' && S.chargeKind === k;
    btn[k].classList.toggle('charging', on);
    btn[k].querySelector('u').style.width = on ? (S.charge * 100) + '%' : '0';
  }
  btn.eye.classList.toggle('on', closed);
  btn.eye.querySelector('b').textContent = closed ? '目を開ける' : '目を閉じる';

  // 夜明けに向けて窓が明るくなる（閉眼中もこれだけは見える）
  const p = S.tick / NIGHT;
  const bright = Math.pow(Math.max(0, p - .62) / .38, 1.6);
  win.material.color.setRGB(.09 + bright * .85, .12 + bright * .78, .2 + bright * .6);
  // 暗幕は完全に不透明。窓の明かりも「不透明な色」で描く。
  // ここに alpha を混ぜると寝室が透けて、REQ-004 と賭けの前提が壊れる
  // D-12: 明かりが出るのは「閉じた瞬間に窓を向いていた」ときだけ。
  //       抱き上げられても動かさない（動かすと寝たふり成功の通知になり REQ-016 が壊れる）
  if (!closed) { $('lid').style.background = '#000'; }
  else {
    const winYaw = THREE.MathUtils.degToRad(-48);           // 窓のだいたいの中心
    const off = (closedYaw === null ? 99 : (closedYaw - winYaw));
    const halfFov = THREE.MathUtils.degToRad(30);
    if (Math.abs(off) > halfFov) {
      $('lid').style.background = '#000';                   // 窓を向いていない → 完全な暗闇
    } else {
      const x = 50 - (off / halfFov) * 45;                  // 画面上の窓の位置
      $('lid').style.background =
        `radial-gradient(70% 46% at ${x.toFixed(0)}% 38%, `
        + `rgb(${14+bright*150|0},${19+bright*140|0},${34+bright*115|0}), #000 60%)`;
    }
  }

  // 親の見え方（P1 では姿勢だけ。段階表示はまだ入れていない）
  const up = S.parent === 'Up';
  // 親がベッドを出ると**視界から消える**。部屋が空になり、顔が読めなくなる
  const gone = up ? Math.min(1, (upT += 0.035)) : (upT = Math.max(0, upT - 0.05));
  parent.position.y = gone * 1.05;
  parent.position.z = .15 - gone * 1.1;
  parent.visible = gone < 0.97;
  // もう一人の親（出来事）
  partner.visible = S.partnerHere;
  // 部屋の照明: 親が起きている間と、終盤（山札が残りわずか）
  lamp.intensity = (up ? 1.6 : 0) + (S.handTotal <= 3 ? 1.0 : 0);
  // 寝返り: 顔が向こうを向く
  parent.rotation.y = S.tick < S.rollUntil ? -1.5 : 0;
  // 寝入りばな。予兆＝呼吸が深くなる / 窓＝かくっと力が抜ける。**顔を見ていないと分からない**
  const dip = S.tick < S.dipUntil;
  const warn = S.dipNext <= 1e8 && S.tick < S.dipNext;
  const breath = warn ? Math.sin(S.tick / 11) * .045 : Math.sin(S.tick / 26) * .012;
  head.position.y = 1.15 + (up ? .45 : 0) + breath - (dip ? .05 : 0);
  head.scale.set(1, dip ? .90 : 1 + breath * .4, 1);
  torso.scale.set(1, 1 + breath * .5, 1);
  const closedEyes = (S.parent === 'Sleep' || S.parent === 'Settle');
  eyeL.position.set(.105, head.position.y - .205, .075);
  eyeR.position.set(.105, head.position.y - .205, -.075);
  eyeL.scale.z = eyeR.scale.z = closedEyes ? .18 : 1;
  eyeL.scale.y = eyeR.scale.y = closedEyes ? .3 : 1;
  // 対処中と抱き上げ中は手が伸びてくる
  const reach = S.parent === 'Care' ? 1 : S.parent === 'Settle' ? 1 - S.tSettle / T_SETTLE : 0;
  hand.position.set(-.20 + reach * .32, .73 - reach * .18, -.33 + reach * .20);
  parent.position.x = -.30 + (S.parent === 'Settle' ? .12 : 0);

  // 見ているものだけ分かる
  const look = closed ? null : lookingAt();
  $('look').classList.toggle('on', !!look);
  const rolling = S.tick < S.rollUntil;                 // 寝返り中は顔が見えない
  const seeFace = look === 'face' && !rolling;
  const seeHand = look === 'hand';
  const seeWin  = look === 'window';
  const setBar = (id, v, label) => {
    document.querySelector('#' + id + ' i').style.width = Math.max(0, Math.min(100, v)) + '%';
    if ($(id + '-n')) $(id + '-n').textContent = label;
  };
  $('r-ar').classList.toggle('masked', !seeFace);
  $('r-ca').classList.toggle('masked', !seeHand);
  $('r-tm').classList.toggle('masked', !seeWin);
  setBar('ar', seeFace ? S.arousal : 0, seeFace ? S.arousal : (rolling && look === 'face' ? '寝返り' : '？'));
  setBar('vi', S.vigor, S.vigor);                       // 自分の体なので常に分かる
  setBar('tm', seeWin ? S.tick / NIGHT * 100 : 0, seeWin ? gameClock(S.tick) : '？');
  $('ca').textContent = !seeHand ? '？'
    : S.parent === 'Care'        ? CARE[S.careKind].name + '中'
    : S.pendingCare !== null     ? CARE[S.pendingCare].name + 'に手を伸ばしている'
    : S.parent === 'Settle' || S.parent === 'Grace' ? '—'
    : '動いていない（残り ' + S.handTotal + ' 枚）';
  $('ar').classList.toggle('max', seeFace && S.arousal >= AROUSAL_MAX);

  // コーチ。今どういう状況で、何を試せるかを言う
  $('coach').innerHTML = coachText();

  if (showNum) {
    const c = S.careKind !== null ? CARE[S.careKind].name : (S.pendingCare !== null ? '…来る' : '—');
    $('hud').textContent =
      `tick ${String(S.tick).padStart(4)} / ${NIGHT}   ${gameClock(S.tick)}   得点 ${S.score}\n` +
      `覚醒度 ${String(S.arousal).padStart(3)}   元気 ${String(S.vigor).padStart(3)}   山札 ${S.handTotal}  [${S.hand.join(' ')}]\n` +
      `親 ${S.parent.padEnd(6)} 対処 ${c}   慣れ ${S.habit.join('/')}\n` +
      `tIdle ${S.tIdle}  tClosed ${S.tClosed}  寝たふり ${S.pretendN} 回目（次の成功率 ${(pretendRate(S.pretendN+1)*100)|0}%）\n` +
      S.log.join('  ');
  }
}
function coachText() {
  const S_ = S;
  if (S_.baby === 'Closed') {
    // ★ 親の状態を絶対に出さない。出した瞬間に REQ-016（成否を事前に知らされない）が壊れる
    const lit = closedYaw !== null
      && Math.abs(closedYaw - THREE.MathUtils.degToRad(-48)) <= THREE.MathUtils.degToRad(30);
    return '何も見えない。<b>いつ目を開けるか</b>が賭け。<br>'
         + '置かれた直後に泣けば最大の一撃、早すぎれば気づかれる'
         + (lit ? '<br><b>窓を向いて閉じたので、明るさで時間帯だけ分かる</b>' : '');
  }
  if (S_.parent === 'Grace')  return '<b>置かれた！ いま泣く！</b>';
  if (S_.parent === 'Settle') return '抱き上げられている（目を開けたので気づかれる）';
  if (S_.parent === 'Up')     return '<b>親がベッドを出て部屋からいなくなった。</b>顔が見えないので覚醒度も読めない<br>'
                                    + '静かにしていれば戻ってきて、また寝る（<b>行動すると戻りが遅れる</b>）';
  if (S_.parent === 'Care')   return CARE[S_.careKind].name + '中。<b>この間は泣いても覚醒度が上がらない</b>';
  if (S_.pendingCare !== null) return '親が手を伸ばしている。<b>対処が返るまで泣いても覚醒度は上がらない</b><br>'
                                    + '（親の手を見れば、何が来るか分かる）';
  if (S_.vigor < 20)          return '元気が尽きた。<b>何もしないと回復する</b>';
  if (S_.arousal > 78)        return 'あと少しで起こせる。強い一撃がほしい';
  if (S_.baby === 'Charge')   return '押している間ずっと強くなる。<b>離した瞬間の強さで決まる</b><br>'
                                    + '引っ張るほど元気を食い、<b>親が対処を出してくる</b>';
  if (S_.tick < S_.dipUntil && lookingAt() === 'face')
    return '<b>かくっと力が抜けた。寝入りばな — いま当てれば 2.5 倍</b>';
  if (S_.dipNext <= 1e8 && S_.tick < S_.dipNext && lookingAt() === 'face')
    return '<b>親の呼吸が深くなった。</b>もうすぐ寝入りばなが来る<br>いまから溜め始めれば間に合う';
  if (S_.arousal < 35)        return '親は深く寝ている。<b>いま泣くと一番効く</b>';
  if (S_.pretendN === 0 && S_.tick > 600)
    return '<b>目を閉じる</b>＝寝たふり。うまくいけば抱き上げて布団に置かれ、<br>その直後に目を開けて泣くと<b>この夜で最大の一撃</b>';
  if (S_.tick < S_.rollUntil) return '親が寝返りを打った。<b>顔が見えないので覚醒度が読めない</b>';
  if (S_.tick < S_.hungryUntil) return 'おなかが空いている。<b>元気が減り続ける</b>';
  const look = lookingAt();
  if (look === null && S_.tick > 200)
    return '天井を見ている。<b>首を振って親の顔・親の手・窓を見る</b><br>顔＝覚醒度 / 手＝次に来る対処 / 窓＝残り時間';
  return '待つほど親の覚醒度が下がり、次の一撃が効く。<br>でも待ちすぎると<b>自分が寝てしまう</b>';
}

const gameClock = t => {
  const m = 21 * 60 + Math.floor(t * 6 / 60);
  return `${String(Math.floor(m / 60) % 24).padStart(2,'0')}:${String(m % 60).padStart(2,'0')}`;
};
function showEnd() {
  const kind = { dawn:'夜が明けた', fellAsleep:'寝てしまった', handEmpty:'親が諦めた' }[S.over];
  $('b-title').textContent = `${kind} — ${S.score} 点`;
  $('b-body').textContent =
    `${gameClock(S.tick)}まで。寝たふり ${S.pretendN} 回、山札 残り ${S.handTotal} 枚、出来事 ${S.eventsFired} 件。\n\n` +
    `測っているのは「7 秒の盲目が緊張か退屈か」と「待つか泣くかで迷ったか」。`;
  $('banner').style.display = 'grid';
}
requestAnimationFrame(frame);
</script>
